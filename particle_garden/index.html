<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Petal Physics — Interactive Particle Garden</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#30302d;background:#f6f5f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:28px}main{width:min(1320px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin:0 0 20px}.brand{display:flex;gap:12px;align-items:center}.mark{height:39px;width:39px;border-radius:13px;background:#2e332f;color:#fff;display:grid;place-items:center;font-size:22px}.eyebrow{color:#898b82;letter-spacing:.14em;text-transform:uppercase;font-size:10px;font-weight:700}.brand h1{font-size:21px;letter-spacing:-.055em;margin:3px 0 0;font-weight:650}.note{font-size:12px;color:#8c8e86}.scene-wrap{position:relative;overflow:hidden;border-radius:20px;border:1px solid #e3e4dd;background:#fbfaf6;box-shadow:0 18px 60px rgba(36,42,32,.06)}canvas{width:100%;height:auto;aspect-ratio:1200/590;display:block;touch-action:none;cursor:crosshair}.top-label{position:absolute;left:26px;top:23px;font-size:11px;color:#858780;letter-spacing:.03em;pointer-events:none}.status{position:absolute;right:23px;top:18px;display:flex;gap:8px;pointer-events:none}.pill{background:rgba(255,255,255,.78);border:1px solid #e5e6df;border-radius:99px;padding:7px 10px;font-size:10px;color:#71746d}.control-bar{margin-top:15px;border:1px solid #e2e3db;background:#ffffff;border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:18px;align-items:center;box-shadow:0 7px 30px rgba(42,43,34,.035)}.group{min-width:0}.group>label,.group>.field-title{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#666a62;font-weight:600;margin-bottom:9px}.group output{font-variant-numeric:tabular-nums;color:#9a9c95;font-weight:500}.seg{display:flex;gap:5px}.seg button{flex:1}button{border:1px solid #e5e6df;color:#5a5f56;background:#f8f9f5;border-radius:9px;padding:9px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:background .2s,transform .12s}button:hover{background:#e9ece4}button:active{transform:scale(.97)}button.active{color:#fff;background:#343d34;border-color:#343d34}.actions{display:flex;gap:7px}#gust{background:#dce9d3;border-color:#d0dfc4;color:#334331;white-space:nowrap}input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:4px;border-radius:10px;background:#e2e5dd;outline:none;cursor:pointer}input[type=range]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;background:#536a4c;border:3px solid white;border-radius:50%;box-shadow:0 0 0 1px #a7b4a0}footer{display:flex;justify-content:space-between;margin-top:13px;color:#999b92;font-size:11px;gap:20px}kbd{border:1px solid #dcded5;padding:2px 5px;border-radius:5px;background:white;color:#74786f}@media(max-width:850px){body{padding:13px}.control-bar{grid-template-columns:1fr 1fr;gap:16px}.actions{grid-column:1/-1}.actions button{flex:1}.note{display:none}.scene-wrap{border-radius:14px}.top-label{font-size:9px;top:12px;left:12px}.status{top:10px;right:8px}.pill{font-size:8px;padding:5px 7px}footer{flex-direction:column;gap:5px}}
</style></head><body><main><header><div class="brand"><div class="mark">✳</div><div><div class="eyebrow">A little world of motion</div><h1>Petal Physics <span style="font-weight:400;color:#aaa;font-size:12px;letter-spacing:0">/ interactive garden</span></h1></div></div><div class="note">Made with simulated forces, not a video loop</div></header><div class="scene-wrap"><canvas id="garden" aria-label="Interactive 2D garden. Drag over the trees to stir petals and leaves."></canvas><div class="top-label">DRAG TO STIR THE TREES <span style="color:#b8bbb2">·</span> TAP TO MAKE A GUST</div><div class="status"><span class="pill" id="particleCount">0 particles</span><span class="pill" id="windLabel">Wind →</span></div></div><div class="control-bar"><div class="group"><div class="field-title">Mode</div><div class="seg"><button id="mode-gentle" class="active">Gentle</button><button id="mode-breezy">Breezy</button><button id="mode-storm">Storm</button></div></div><div class="group"><label for="wind">Wind strength <output id="windOut">28%</output></label><input id="wind" type="range" min="0" max="100" value="28"/></div><div class="group"><label for="gravity">Gravity <output id="gravOut">1.0×</output></label><input id="gravity" type="range" min="10" max="220" value="100"/></div><div class="group"><label for="shed">Leaf release <output id="shedOut">35%</output></label><input id="shed" type="range" min="0" max="100" value="35"/></div><div class="actions"><button id="gust">↝ Gust</button><button id="reset">↻ Reset</button><button id="theme" title="Toggle night">☾</button></div></div><footer><span>Cherry blossom <span style="color:#d7aab5">●</span> · Boxwood shrub <span style="color:#98b178">●</span> · Autumn maple <span style="color:#d99a53">●</span></span><span><kbd>Drag</kbd> influence foliage &nbsp; <kbd>Space</kbd> gust &nbsp; <kbd>R</kbd> reset</span></footer></main><script>
(()=>{'use strict';
const canvas=document.getElementById('garden'),ctx=canvas.getContext('2d');const W=1200,H=590,GROUND=512;let dpr=1,night=false,seed=4931,t=0,last=performance.now(),globalGust=0,particles=[],trees=[],dust=[];let windStrength=.28,gravityScale=1,shed=.35,pointer={vx:0,vy:0,x:-500,y:-500,px:-500,py:-500,down:false,moved:0,last:0};
function rng(){seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/4294967296}const rand=(a,b)=>a+(b-a)*rng(),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const palettes={sakura:['#f3cbd6','#e6a9ba','#f9dce5','#d994ad','#fce4e8','#e7b5c5'],shrub:['#8fac58','#5c823e','#b3c675','#749c4c','#4f733c','#9dba68'],maple:['#d79a51','#e6ac64','#b9693d','#f0c17e','#c77c3e','#f2cc89']};
function makeBranch(tree,x,y,len,ang,thick,depth,parent=-1){const xx=x+Math.cos(ang)*len,yy=y+Math.sin(ang)*len,idx=tree.branches.length,k=26+thick*2.4;
// Each branch is a damped torsional spring (dev, vel) hanging off its parent; angles accumulate down the tree (cum), so twigs whip further than the trunk.
tree.branches.push({x,y,xx,yy,rx:x,ry:y,rxx:xx,ryy:yy,thick,len,ang0:ang,parent,dev:0,vel:0,cum:0,vx:0,vy:0,k,c:2*.22*Math.sqrt(k),flex:.4/(1+thick*.4)});if(depth<=0||len<7){tree.tips.push(idx);return}const splits=depth>3?2:rand(2,4)|0;for(let i=0;i<splits;i++){let a=ang+rand(-.72,.72)+(i-(splits-1)/2)*.18;makeBranch(tree,xx,yy,len*rand(.65,.8),a,thick*.69,depth-1,idx)} }
function buildTree(type,x,scale){let tree={type,x,scale,branches:[],tips:[],attached:[],ground:GROUND,baseY:GROUND};if(type==='shrub'){for(let i=0;i<11;i++){makeBranch(tree,x+rand(-18,18),GROUND,rand(44,73)*scale,rand(-2.8,-.4),rand(5,9),3)}}else{makeBranch(tree,x,GROUND,rand(95,115)*scale,-Math.PI/2,rand(15,21)*scale,5)}const count=type==='sakura'?1650:type==='maple'?1400:1150;const cx=type==='shrub'?x: x,cy=type==='shrub'?GROUND-66*scale:GROUND-206*scale, rx=type==='shrub'?110*scale:127*scale, ry=type==='shrub'?59*scale:109*scale;
for(let i=0;i<count;i++){let a=rand(0,Math.PI*2),r=Math.sqrt(rng()),px=cx+Math.cos(a)*r*rx,py=cy+Math.sin(a)*r*ry;let topEnvelope=type==='shrub'?(py>GROUND-6):false;if(topEnvelope)py=GROUND-rand(8,35);let ti=0,bd=1e9;for(const q of tree.tips){const b=tree.branches[q],d=(b.rxx-px)**2+(b.ryy-py)**2;if(d<bd){bd=d;ti=q}}let leaf={x:px,y:py,tip:ti,ox:px-tree.branches[ti].rxx,oy:py-tree.branches[ti].ryy,tvx:0,tvy:0,size:rand(type==='shrub'?2.1:2.5,type==='shrub'?6:7.2)*scale,phase:rand(0,6.28),color:palettes[type][(rng()*6)|0],angle:rand(0,Math.PI*2),detached:false,shape:type};tree.attached.push(leaf)}trees.push(tree)}
function initialize(){seed=4931;trees=[];particles=[];dust=[];buildTree('sakura',224,1.03);buildTree('shrub',597,.91);buildTree('maple',969,1.04);for(let i=0;i<170;i++){let type=i<65?'sakura':i<95?'shrub':'maple';let x=type==='sakura'?rand(90,350):type==='shrub'?rand(490,695):rand(828,1100);dust.push({x,y:GROUND+rand(-1,8),size:rand(1.1,4),a:rand(-1,1),color:palettes[type][(rng()*6)|0],type})}updateBranches(.016);updateLeaves();document.getElementById('particleCount').textContent='0 floating particles'}
function createParticle(leaf,tx,ty,impulseX=0,impulseY=0){if(particles.length>1700)return;const p={x:leaf.x,y:leaf.y,px:leaf.x,py:leaf.y,vx:leaf.tvx+impulseX+rand(-12,12),vy:leaf.tvy+impulseY+rand(-8,7),rotation:leaf.angle,omega:rand(-3,3),roll:rand(0,6.28),k:rand(.85,1.2),turb:rand(0,6.28),phase:leaf.phase,flutter:rand(1.7,5.5),size:leaf.size,color:leaf.color,type:leaf.shape,settled:false,age:0,spinAxis:rand(0,6.28)};particles.push(p);leaf.detached=true}
function leafShape(x,y,size,angle,type,color,flip=1){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(1,flip);ctx.fillStyle=color;if(type==='sakura'){ctx.beginPath();ctx.moveTo(0,-size*.8);ctx.bezierCurveTo(size*.95,-size*.95,size*.8,size*.2,0,size*.85);ctx.bezierCurveTo(-size*.85,size*.2,-size*.95,-size*.9,0,-size*.8);ctx.fill();}else if(type==='shrub'){ctx.beginPath();ctx.ellipse(0,0,size*.53,size*.87,.1,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();let pts=10;for(let i=0;i<pts;i++){let a=i*Math.PI*2/pts-Math.PI/2;let rad=size*(i%2? .48:1);ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill()}ctx.restore()}
function drawBranches(tree){ctx.lineCap='round';ctx.lineJoin='round';const bark=tree.type==='sakura'?'#6e524e':tree.type==='maple'?'#786448':'#5f7448';tree.branches.forEach(b=>{ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.xx,b.yy);ctx.lineWidth=Math.max(.8,b.thick*.71);ctx.strokeStyle=bark;ctx.stroke()})}
function drawGround(){ctx.strokeStyle=night?'#525b50':'#dce1d6';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(0,GROUND+9);ctx.lineTo(W,GROUND+9);ctx.stroke();ctx.fillStyle=night?'rgba(181,196,164,.10)':'rgba(129,151,110,.09)';ctx.fillRect(0,GROUND+10,W,H-GROUND);for(const d of dust)leafShape(d.x,d.y,d.size,d.a,d.type,d.color,.3)}
function updateBranches(dt){const R=pointer.down?120:68;for(const tree of trees){const B=tree.branches;for(let i=0;i<B.length;i++){const b=B[i],P=b.parent>=0?B[b.parent]:null,pc=P?P.cum:0,sx=P?P.xx:b.rx,sy=P?P.yy:b.ry,a=b.ang0+pc+b.dev;
const mx=(b.x+b.xx)/2,my=(b.y+b.yy)/2,inf=clamp(1-Math.hypot(mx-pointer.x,my-pointer.y)/R,0,1);
const w=directionalWind(mx,my)+inf*pointer.vx*.45;
// torque of a horizontal wind force on a rod of angle a: -w*len*sin(a)
const acc=-w*Math.sin(a)*b.flex-inf*pointer.vy*Math.cos(a)*b.flex*.25-b.k*b.dev-b.c*b.vel;
b.vel=clamp(b.vel+acc*dt,-9,9);b.dev=clamp(b.dev+b.vel*dt,-.5,.5);b.cum=pc+b.dev;
const na=b.ang0+b.cum,nx=sx+Math.cos(na)*b.len,ny=sy+Math.sin(na)*b.len;b.vx=(nx-b.xx)/dt;b.vy=(ny-b.yy)/dt;b.x=sx;b.y=sy;b.xx=nx;b.yy=ny}}}
function updateLeaves(){for(const tree of trees){const B=tree.branches;for(const l of tree.attached){if(l.detached)continue;const b=B[l.tip],c=Math.cos(b.cum),s=Math.sin(b.cum);l.x=b.xx+l.ox*c-l.oy*s;l.y=b.yy+l.ox*s+l.oy*c;l.tvx=b.vx;l.tvy=b.vy}}}
function directionalWind(x,y){const wave=.64+ .25*Math.sin(t*1.2+x*.008)+.1*Math.sin(t*3.3+y*.018);return (windStrength*130+globalGust)*wave}
function step(dt){t+=dt;globalGust*=Math.exp(-dt*1.6);updateBranches(dt);const speed=Math.hypot(pointer.x-pointer.px,pointer.y-pointer.py)/Math.max(dt,.001);pointer.moved=pointer.moved*.87;const pointerRadius=pointer.down?120:68;
for(const tree of trees){const chance=(.002+shed*.16)*(windStrength*.3+.25)+Math.max(0,globalGust)*.0002;for(const l of tree.attached){if(l.detached)continue;let dx=l.x-pointer.x,dy=l.y-pointer.y,dist=Math.hypot(dx,dy),localized=clamp(1-dist/pointerRadius,0,1);let trigger=(chance*(tree.type==='shrub'?.20:1)+localized*(pointer.down?.95:.20))*dt;if(rng()<trigger){let push=localized*(pointer.down?140:65);createParticle(l,tree.x,GROUND,directionalWind(l.x,l.y)*.13+(pointer.x-pointer.px)*push*.05,-rand(0,30)-localized*70)}}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];if(p.settled)continue;p.age+=dt;const dx=p.x-pointer.x,dy=p.y-pointer.y,dist=Math.hypot(dx,dy),influence=clamp(1-dist/(pointer.down?145:75),0,1);const g=180*gravityScale,terminal=p.type==='sakura'?64:p.type==='maple'?89:110,kl=.5,cn=(180-kl*terminal)/(terminal*terminal),ct=.12*cn;
// Local wind plus a slowly varying eddy so neighbouring leaves share, but don't copy, the same air.
const wx=(directionalWind(p.x,p.y)+influence*pointer.vx*.7)*1.6,wy=influence*pointer.vy*.38+Math.sin(t*1.3+p.x*.011+p.y*.007)*(6+windStrength*26);
const rvx=p.vx-wx,rvy=p.vy-wy,sp=Math.hypot(rvx,rvy),sn=Math.sin(p.rotation),cs=Math.cos(p.rotation);
// Flat-plate model: force on the normal scales with vn|vn| (broadside = big drag, edge-on = slips), so a tilted leaf glides sideways.
const vn=-rvx*sn+rvy*cs,vt=rvx*cs+rvy*sn;
const ax=cn*-Math.abs(vn)*vn*-sn-ct*Math.abs(vt)*vt*cs-kl*rvx,ay=g-cn*Math.abs(vn)*vn*cs-ct*Math.abs(vt)*vt*sn-kl*rvy;
p.vx=clamp(p.vx+ax*dt,-410,410);p.vy=clamp(p.vy+ay*dt,-230,terminal*1.9*Math.sqrt(gravityScale));p.x+=p.vx*dt;p.y+=p.vy*dt;
// Torque swings the leaf toward broadside to the relative flow (restoring) while a Van der Pol term feeds energy in until the swing
// reaches amplitude `am`: small am = flutter (maple), big am = overshoot and tumble (petals).
let al=p.rotation-(Math.atan2(rvy,rvx)+Math.PI/2);al-=Math.PI*Math.round(al/Math.PI);
const am=p.type==='sakura'?1.15:p.type==='maple'?.95:.7,mu=p.type==='shrub'?1.2:1.5;
p.omega+=(-(10+sp*.12)*p.k*Math.sin(2*al)+mu*(1-(al/am)**2)*p.omega-.6*p.omega+Math.sin(t*p.flutter+p.turb)*4)*dt;p.omega=clamp(p.omega,-14,14);p.rotation+=p.omega*dt;
p.roll+=(Math.abs(p.omega)*.55+sp*.012)*dt*(p.omega<0?-1:1);
if(p.y>=GROUND+rand(-1,1)){p.y=GROUND+rand(-.8,3);p.omega*=.4;if(Math.abs(p.vy)>35&&rng()<.25){p.vy=-p.vy*.12;p.vx*=.57}else{p.vy=0;p.vx=0;p.settled=true;dust.push({x:p.x,y:p.y,size:p.size*.65,a:p.rotation,color:p.color,type:p.type});particles.splice(i,1);if(dust.length>1700)dust.shift()}}if(p.x>W+120||p.x< -120||p.y>H+100)particles.splice(i,1)}}
function render(){ctx.fillStyle=night?'#161a18':'#fafaf6';ctx.fillRect(0,0,W,H);if(!night){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#fcfcf9');grad.addColorStop(1,'#f5f6f0');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H)}
// Ground first, then trunk silhouettes and textured foliage
ctx.fillStyle=night?'rgba(220,226,213,.035)':'rgba(68,85,55,.025)';ctx.fillRect(0,GROUND+6,W,H-GROUND-6);
for(const tree of trees){ctx.save();ctx.globalAlpha=.10;ctx.fillStyle='#526449';ctx.beginPath();ctx.ellipse(tree.x,GROUND+12,tree.type==='shrub'?117:104,6,0,0,6.3);ctx.fill();ctx.restore();drawBranches(tree);for(let i=0;i<tree.attached.length;i++){const l=tree.attached[i];if(l.detached)continue;const sw=Math.sin(t*(1.3+windStrength)+l.phase)*windStrength*2.3;const sy=Math.sin(t*.9+l.phase)*windStrength*.7;leafShape(l.x+sw,l.y+sy,l.size,l.angle+sw*.05,l.shape,l.color)}}
for(const p of particles){let flip=.3+.7*Math.abs(Math.cos(p.roll));leafShape(p.x,p.y,p.size,p.rotation,p.type,p.color,flip)}drawGround();if(pointer.down){ctx.beginPath();ctx.arc(pointer.x,pointer.y,28+Math.sin(t*9)*3,0,Math.PI*2);ctx.strokeStyle=night?'rgba(255,255,255,.22)':'rgba(71,105,82,.20)';ctx.lineWidth=1.2;ctx.stroke()}
ctx.fillStyle=night?'#949e90':'#a2aaa0';ctx.textAlign='center';ctx.font='11px ui-sans-serif, sans-serif';ctx.fillText('SAKURA',224,562);ctx.fillText('BOXWOOD',597,562);ctx.fillText('MAPLE',969,562);document.getElementById('particleCount').textContent=particles.length+' floating particles';document.getElementById('windLabel').textContent=windStrength>.67?'Wind ⇢⇢':windStrength>.1?'Wind →':'Still air'}
function frame(now){let dt=Math.min((now-last)/1000,.035);last=now;pointer.vx=clamp((pointer.x-pointer.px)/Math.max(dt,.008),-1500,1500);pointer.vy=clamp((pointer.y-pointer.py)/Math.max(dt,.008),-1500,1500);const steps=Math.max(1,Math.ceil(dt/.012));for(let s=0;s<steps;s++)step(dt/steps);updateLeaves();render();pointer.px=pointer.x;pointer.py=pointer.y;requestAnimationFrame(frame)}
function coords(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}function pointerMove(e){const p=coords(e);if(pointer.x===-500){pointer.px=p.x;pointer.py=p.y}pointer.x=p.x;pointer.y=p.y;pointer.last=performance.now()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointerMove(e);pointer.down=true;globalGust+=24;for(const tr of trees){for(let i=0;i<60;i++){const l=tr.attached[(rng()*tr.attached.length)|0];if(l&&!l.detached&&Math.hypot(l.x-pointer.x,l.y-pointer.y)<115)createParticle(l,tr.x,GROUND,rand(-70,70),-rand(0,100))}}});canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',()=>pointer.down=false);canvas.addEventListener('pointercancel',()=>pointer.down=false);canvas.addEventListener('pointerleave',()=>{if(!pointer.down)pointer.x=pointer.y=-500});
const windInput=document.getElementById('wind'),gravityInput=document.getElementById('gravity'),shedInput=document.getElementById('shed');windInput.oninput=e=>{windStrength=+e.target.value/100;document.getElementById('windOut').textContent=e.target.value+'%'};gravityInput.oninput=e=>{gravityScale=+e.target.value/100;document.getElementById('gravOut').textContent=gravityScale.toFixed(1)+'×'};shedInput.oninput=e=>{shed=+e.target.value/100;document.getElementById('shedOut').textContent=e.target.value+'%'};function setMode(mode){let configs={gentle:[28,100,35],breezy:[63,100,55],storm:[97,155,90]};let [w,g,s]=configs[mode];windInput.value=w;windInput.oninput({target:windInput});gravityInput.value=g;gravityInput.oninput({target:gravityInput});shedInput.value=s;shedInput.oninput({target:shedInput});['gentle','breezy','storm'].forEach(m=>document.getElementById('mode-'+m).classList.toggle('active',m===mode));if(mode==='storm')globalGust+=140}['gentle','breezy','storm'].forEach(m=>document.getElementById('mode-'+m).onclick=()=>setMode(m));function gust(){globalGust+=280;for(const tree of trees){for(let i=0;i<65;i++){const l=tree.attached[(rng()*tree.attached.length)|0];if(l&&!l.detached&&rng()<(tree.type==='shrub'?.26:.75))createParticle(l,tree.x,GROUND,rand(40,220),rand(-90,-20))}}}document.getElementById('gust').onclick=gust;document.getElementById('reset').onclick=initialize;document.getElementById('theme').onclick=()=>{night=!night;document.getElementById('theme').textContent=night?'☀':'☾';document.querySelector('.scene-wrap').style.background=night?'#161a18':'#fbfaf6'};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();gust()}if(e.key.toLowerCase()==='r'&&document.activeElement.tagName!=='INPUT')initialize()});function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}resize();initialize();requestAnimationFrame(frame);
})();
</script></body></html>
